<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Burner: send files and text between your devices with a short code.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Burner">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Burner</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#201A17">

  <!-- Splash shown until Flutter draws its first frame.
       Colours: keep in sync with BurnerTheme.splashBackground. -->
  <style>
    html, body { margin: 0; height: 100%; background: #201A17; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      background: #201A17; color: #fff;
      font: 700 28px/1.2 system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
      letter-spacing: .5px; transition: opacity .25s ease-out; z-index: 10;
    }
    #splash img { width: 96px; height: 96px; }
    #splash .bar {
      width: 72px; height: 3px; margin-top: 16px; border-radius: 2px;
      background: rgba(255,176,77,.2); overflow: hidden; position: relative;
    }
    #splash .bar::after {
      content: ""; position: absolute; inset: 0; width: 40%;
      background: #FFB04D; border-radius: 2px; animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    #splash.hide { opacity: 0; pointer-events: none; }
    @media (prefers-reduced-motion: reduce) { #splash .bar::after { animation: none; width: 100%; } }
  </style>
</head>
<body>
  <div id="splash" aria-label="Loading Burner">
    <img src="splash/flame.png" alt="">
    <div>Burner</div>
    <div class="bar"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('splash');
      if (!splash) return;
      splash.classList.add('hide');
      setTimeout(function () { splash.remove(); }, 300);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
